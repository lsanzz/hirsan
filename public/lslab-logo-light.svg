<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimaryLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#00C4FF" />
    </linearGradient>

    <linearGradient id="gradSecondaryLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0062FF" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background White Card -->
  <rect width="800" height="240" rx="20" fill="#FFFFFF" />
  <rect width="798" height="238" x="1" y="1" rx="19" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Ambient Light Glow Behind Icon -->
  <circle cx="120" cy="120" r="60" fill="#00C4FF" opacity="0.08" />

  <!-- ICON: Geometric Monogram L + S -->
  <g transform="translate(45, 45)" filter="url(#softShadowLight)">
    <!-- Base Icon Container Frame (Isometric Hex Shield) -->
    <polygon points="75,5 140,42 140,118 75,155 10,118 10,42" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

    <!-- Isometric 'L' Segment -->
    <path d="M 40,36 L 68,20 L 68,90 L 112,115 L 94,125 L 40,94 Z" fill="url(#gradPrimaryLight)" />

    <!-- Isometric 'S' Segment -->
    <path d="M 110,48 L 82,32 L 82,48 L 56,63 L 74,73 L 100,58 Z" fill="#334155" />
    <path d="M 110,48 L 110,88 L 68,112 L 68,96 L 94,81 L 94,65 L 110,56 Z" fill="url(#gradPrimaryLight)" />

    <!-- Spark Accent Core -->
    <polygon points="75,70 85,76 75,82 65,76" fill="#00C4FF" />
  </g>

  <!-- TYPOGRAPHY -->
  <text x="220" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="#0F172A">
    LS
  </text>

  <text x="312" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" fill="url(#gradPrimaryLight)">
    LAB
  </text>

  <circle cx="452" cy="126" r="6" fill="#0062FF" />

  <text x="222" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#64748B">
    DIGITAL SOLUTIONS
  </text>
</svg>
