<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0061FF" />
    </linearGradient>

    <linearGradient id="gradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60EFFF" />
      <stop offset="100%" stop-color="#1BFFFF" />
    </linearGradient>

    <linearGradient id="gradDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="gradTextLab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0061FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="20" fill="url(#gradDarkBg)" />
  <rect width="798" height="238" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Subtle Ambient Glow Behind Icon -->
  <circle cx="120" cy="120" r="70" fill="#0061FF" opacity="0.18" filter="url(#glow)" />
  <circle cx="125" cy="115" r="45" fill="#00F2FE" opacity="0.12" filter="url(#glow)" />

  <!-- ICON: Geometric Modern Monogram L + S with Lab Precision -->
  <g transform="translate(45, 45)" filter="url(#softShadow)">
    <!-- Base Icon Container Frame (Isometric Hex Shield) -->
    <polygon points="75,5 140,42 140,118 75,155 10,118 10,42" fill="#0D1829" stroke="#1E2E4A" stroke-width="2" />

    <!-- Isometric 'L' Segment -->
    <path d="M 40,36 L 68,20 L 68,90 L 112,115 L 94,125 L 40,94 Z" fill="url(#gradPrimary)" />

    <!-- Isometric 'S' Segment (Interlocking ribbon) -->
    <path d="M 110,48 L 82,32 L 82,48 L 56,63 L 74,73 L 100,58 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 110,48 L 110,88 L 68,112 L 68,96 L 94,81 L 94,65 L 110,56 Z" fill="url(#gradSecondary)" />

    <!-- Dynamic Tech Accent Core (The Lab Spark) -->
    <polygon points="75,70 85,76 75,82 65,76" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "LS" - Bold Modern Tech Grotesk -->
  <text x="220" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="#FFFFFF">
    LS
  </text>

  <!-- "LAB" - Gradient Highlight Accent -->
  <text x="312" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" fill="url(#gradTextLab)">
    LAB
  </text>

  <!-- Dot Terminal Accent -->
  <circle cx="452" cy="126" r="6" fill="#00F2FE" filter="url(#glow)" />

  <!-- Tagline / Descriptor -->
  <text x="222" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#94A3B8">
    DIGITAL SOLUTIONS
  </text>

  <!-- Subtle Tech Grid Accent on the right side -->
  <g opacity="0.15" stroke="#4FACFE" stroke-width="1">
    <line x1="680" y1="60" x2="740" y2="60" />
    <line x1="710" y1="30" x2="710" y2="90" />
    <circle cx="710" cy="60" r="3" fill="#00F2FE" />

    <line x1="640" y1="180" x2="720" y2="180" />
    <line x1="680" y1="150" x2="680" y2="210" />
    <circle cx="680" cy="180" r="2.5" fill="#4FACFE" />
  </g>
</svg>
