<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <!-- Clean Light Mode Background -->
  <rect width="600" height="160" fill="#FFFFFF" rx="8" />

  <!-- MINIMALIST EMBLEM -->
  <!-- Concept: Architectural Geometric Monogram (Flat, Razor-sharp, Zero AI tropes) -->
  <g transform="translate(48, 40)">
    <!-- Solid base container (Optional clean studio badge) -->
    <rect width="80" height="80" rx="16" fill="#09090B" />

    <!-- Pure geometric L-S negative space / minimalist cutout -->
    <!-- The 'L': bold vertical pillar & base -->
    <path d="M 24 22 L 32 22 L 32 50 L 48 50 L 48 58 L 24 58 Z" fill="#FFFFFF" />

    <!-- The 'S': minimal modern architectural accent -->
    <path d="M 38 22 L 56 22 L 56 30 L 44 30 L 44 36 L 56 36 L 56 46 L 36 46 L 36 38 L 48 38 L 48 32 L 38 32 Z" fill="#FFFFFF" />
  </g>

  <!-- REFINED STUDIO TYPOGRAPHY -->
  <g transform="translate(152, 90)">
    <!-- 'LS' in bold contemporary grotesque -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-1.8" fill="#09090B">
      LS
    </text>

    <!-- Subtle divider slash -->
    <text x="64" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="38" fill="#D4D4D8">
      /
    </text>

    <!-- 'LAB' in refined modern neutral weight -->
    <text x="84" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="44" letter-spacing="-0.8" fill="#18181B">
      LAB
    </text>

    <!-- Minimalist descriptor -->
    <text x="2" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" letter-spacing="3.5" fill="#71717A">
      DESIGN &amp; WEB STUDIO
    </text>
  </g>
</svg>
