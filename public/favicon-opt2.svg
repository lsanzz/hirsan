<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Hirsan Symbol (Option 2 — Monolithic Diagonal Chevron 'H') -->
  <rect width="64" height="64" rx="16" fill="#17191C" />
  <g fill="#FAFAFA">
    <!-- Left Ascender -->
    <polygon points="12,12 24,12 24,52 12,52" />
    <!-- Diagonal Bridge & Right Leg -->
