    <!-- Pure geometric L-S glyph -->
    <path d="M 24 22 L 32 22 L 32 50 L 48 50 L 48 58 L 24 58 Z" fill="#F4F4F5" />
    <path d="M 38 22 L 56 22 L 56 30 L 44 30 L 44 36 L 56 36 L 56 46 L 36 46 L 36 38 L 48 38 L 48 32 L 38 32 Z" fill="#F4F4F5" />
  </g>

