    <text x="2" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" letter-spacing="3.5" fill="#A1A1AA">
